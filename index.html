<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SI Pengadaan Barang/Jasa - Kemenag Kab. Indramayu</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">

  <!--
    Library pihak ketiga (Keputusan 3: grid HPS pakai library, bukan buatan sendiri).
    Versi DIPIN ke major version sesuai instruksi "versi harus dipin, sumber
    didokumentasikan". Sengaja dipin ke v4 (bukan v5 terbaru) karena API v4
    yang dipakai kode ini; v5 mengubah beberapa API-nya.
      - jspreadsheet CE  : grid ala Excel + paste multi-sel   (MIT, github.com/jspreadsheet/ce)
      - jsuites          : dependensi wajib jspreadsheet CE   (MIT, jsuites.net)
      - SheetJS (xlsx)   : baca file .xlsx/.xls/.csv di browser (Apache-2.0, sheetjs.com)
  -->
  <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4/dist/index.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4/dist/jspreadsheet.min.css" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/jsuites@4/dist/jsuites.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites@4/dist/jsuites.min.css" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app-root">

    <!-- ===================== VIEW: LOGIN ===================== -->
    <div id="view-login" class="view">
      <div class="login-card">
        <div class="login-header">
          <h1>Sistem Informasi Pengadaan Barang/Jasa</h1>
          <p>Kementerian Agama Kabupaten Indramayu</p>
        </div>

        <form id="form-login" autocomplete="off">
          <label for="input-username">Username / Email</label>
          <input type="text" id="input-username" autocomplete="username" required>

          <label for="input-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="input-password" autocomplete="current-password" required>
            <button type="button" id="btn-toggle-password" aria-label="Tampilkan/sembunyikan password">&#128065;</button>
          </div>

          <label for="input-captcha">Kode Keamanan</label>
          <div class="captcha-wrap">
            <canvas id="captcha-canvas" width="150" height="50" aria-label="Gambar kode keamanan"></canvas>
            <button type="button" id="btn-refresh-captcha" title="Muat ulang kode" aria-label="Muat ulang kode">&#8635;</button>
          </div>
          <input type="text" id="input-captcha" autocomplete="off" required placeholder="Ketik kode pada gambar di atas">

          <div id="login-error" class="error-text" role="alert"></div>
          <button type="submit" id="btn-login">MASUK</button>
        </form>

        <p class="login-footer">Internal System — Kementerian Agama Kabupaten Indramayu</p>
      </div>
    </div>

    <!-- ===================== VIEW: APLIKASI ===================== -->
    <div id="view-app" class="view" style="display:none;">
      <aside class="sidebar">
        <div class="sidebar-brand">SI Pengadaan</div>
        <nav>
          <a href="#/dashboard" data-view="dashboard">Dashboard</a>
          <a href="#/satker" data-view="satker">Satker</a>
          <a href="#/pagu" data-view="pagu">Pagu</a>
          <a href="#/penyedia" data-view="penyedia">Penyedia</a>
          <a href="#/paket" data-view="paket">Paket</a>
          <a href="#/laporan" data-view="laporan">Laporan</a>
          <a href="#/years" data-view="years" class="admin-only">Tahun Anggaran</a>
          <a href="#/assignments" data-view="assignments" class="admin-only">Assignment</a>
          <a href="#/users" data-view="users" class="admin-only">Pengguna</a>
          <a href="#/audit" data-view="audit" class="admin-only">Audit Log</a>
          <a href="#/profile" data-view="profile">Ganti Password</a>
        </nav>
      </aside>
      <div class="main-area">
        <header class="topbar">
          <input type="search" id="global-search" placeholder="Cari satker, paket, penyedia..." autocomplete="off">
          <span id="topbar-user"></span>
          <button id="btn-logout">Keluar</button>
        </header>
        <div id="search-results" class="search-results" style="display:none;"></div>
        <main id="content-area"></main>
      </div>
    </div>

    <div id="toast" class="toast" style="display:none;"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
